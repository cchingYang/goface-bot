name: Create Blog Post

on:
  workflow_dispatch:
    inputs:
      driveFolderUrl:
        description: 'Google Drive folder URL'
        required: true
        type: string
      slackUser:
        description: 'Slack user who triggered this'
        required: true
        type: string
      channel:
        description: 'Slack channel ID'
        required: true
        type: string
      ts:
        description: 'Slack thread timestamp'
        required: true
        type: string

jobs:
  create-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run create blog
        run: npx ts-node run-create-blog.ts
        env:
          DRIVE_FOLDER_URL: ${{ inputs.driveFolderUrl }}
          SLACK_USER: ${{ inputs.slackUser }}
          SLACK_CHANNEL: ${{ inputs.channel }}
          SLACK_TS: ${{ inputs.ts }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          GITHUB_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
          GITHUB_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
          GITHUB_BASE_BRANCH: main
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
